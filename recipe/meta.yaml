{% set name = "ryp" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ryp-{{ version }}.tar.gz
  sha256: 2ff3bc33baeda75014533cc16600e780dfc266eab8241eeeb0cf8b7afe9e60bf
  patches:
    - 0001-revert-pyproject-license-format.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - cffi
    - pyarrow
    - r-base
    - r-arrow

test:
  imports:
    - ryp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/ryp
  summary: R inside Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Wainberg
    - keon-arbabi
